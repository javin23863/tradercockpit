<line x1="170" y1="455" x2="1750" y2="455" class="accent-line"/>
<line x1="170" y1="755" x2="1750" y2="755" class="cyan-line"/>
<circle cx="360" cy="455" r="28" fill="#f5f1e8"/>
<circle cx="880" cy="455" r="28" fill="#d27ca7"/>
<circle cx="360" cy="755" r="28" fill="#f5f1e8"/>
<circle cx="880" cy="755" r="28" fill="#7ed7d2"/>
<line x1="1010" y1="350" x2="1010" y2="860" class="line" stroke-dasharray="14 18"/>
<text x="170" y="360" class="kicker" text-anchor="start">SPY / STOCK / D1</text>
<text x="170" y="660" class="kicker" text-anchor="start">DOW / FUTURES</text>
<text x="250" y="535" class="mono" text-anchor="start">5  →  0</text>
<text x="750" y="535" class="body" text-anchor="start">holdout not reached</text>
<text x="250" y="835" class="mono" text-anchor="start">184  →  154</text>
<text x="850" y="835" class="body" text-anchor="start">30 dropped in later block</text>
<text x="1390" y="435" class="small" text-anchor="middle">different lane</text>
