<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<rect width="1920" height="1080" fill="#08030a"/>
<text x="110.0" y="115.0" fill="#f5e8ea" font-family="Cascadia Mono,Cascadia Code,Consolas,monospace" font-size="58" font-weight="750" text-anchor="start">FIXED-TRADE REPRICING</text>
<text x="110.0" y="165.0" fill="#c89aa3" font-family="Cascadia Mono,Cascadia Code,Consolas,monospace" font-size="25" font-weight="500" text-anchor="start">ONE COST INPUT CHANGED · EXECUTION WAS NOT REPLAYED</text>
<line x1="110.0" y1="198.0" x2="1810.0" y2="198.0" stroke="#3a0d1a" stroke-width="2"/>
<rect x="110.0" y="245.0" width="1700.0" height="680.0" rx="18" fill="#0a0407" fill-opacity="1" stroke="#3a0d1a"/>
<text x="960.0" y="360.0" fill="#f5e8ea" font-family="Cascadia Mono,Cascadia Code,Consolas,monospace" font-size="38" font-weight="700" text-anchor="middle">stressed net = baseline net − added execution cost</text>
<text x="960.0" y="500.0" fill="#f5e8ea" font-family="Cascadia Mono,Cascadia Code,Consolas,monospace" font-size="34" font-weight="700" text-anchor="middle">added cost = completed trades × extra cost per trade × position size</text>
<line x1="270.0" y1="590.0" x2="1650.0" y2="590.0" stroke="#3a0d1a" stroke-width="3"/>
<text x="420.0" y="680.0" fill="#c89aa3" font-family="Cascadia Mono,Cascadia Code,Consolas,monospace" font-size="25" font-weight="700" text-anchor="middle">TRADE LIST</text>
<text x="420.0" y="735.0" fill="#00e676" font-family="Cascadia Mono,Cascadia Code,Consolas,monospace" font-size="42" font-weight="750" text-anchor="middle">fixed</text>
<text x="960.0" y="680.0" fill="#c89aa3" font-family="Cascadia Mono,Cascadia Code,Consolas,monospace" font-size="25" font-weight="700" text-anchor="middle">FILLS AND QUEUE</text>
<text x="960.0" y="735.0" fill="#ff1744" font-family="Cascadia Mono,Cascadia Code,Consolas,monospace" font-size="38" font-weight="750" text-anchor="middle">not re-simulated</text>
<text x="1500.0" y="680.0" fill="#c89aa3" font-family="Cascadia Mono,Cascadia Code,Consolas,monospace" font-size="25" font-weight="700" text-anchor="middle">SLIPPAGE INPUT</text>
<text x="1500.0" y="735.0" fill="#ff9100" font-family="Cascadia Mono,Cascadia Code,Consolas,monospace" font-size="42" font-weight="750" text-anchor="middle">2× and 3×</text>
<text x="960.0" y="875.0" fill="#f5e8ea" font-family="Cascadia Mono,Cascadia Code,Consolas,monospace" font-size="28" font-weight="700" text-anchor="middle">A linear repricing check is useful only inside these fixed assumptions.</text>
<line x1="110.0" y1="1002.0" x2="1810.0" y2="1002.0" stroke="#3a0d1a" stroke-width="2"/>
<text x="110.0" y="1040.0" fill="#c89aa3" font-family="Cascadia Mono,Cascadia Code,Consolas,monospace" font-size="20" font-weight="500" text-anchor="start">RECORDED METHOD · SAME SAVED TRADES, DIFFERENT ASSUMED COST</text>
</svg>
