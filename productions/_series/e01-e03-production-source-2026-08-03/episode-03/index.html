53.</text><circle cx="1136" cy="574" r="58" class="veto-ring" /><text x="1136" y="568" class="veto-text" text-anchor="middle">ONE</text><text x="1136" y="598" class="veto-small" text-anchor="middle">WEAK VIEW</text></g><g id="state-funnel" class="state" aria-label="START WITH THE SAME COHORT"><text x="54" y="58" class="eyebrow" text-anchor="start">START WITH THE SAME COHORT</text><text x="54" y="154" class="hero-small" text-anchor="start">154 CANDIDATES ENTER</text><text x="54" y="198" class="subhead" text-anchor="start">The list stays fixed while the views change.</text><rect x="54" y="286" width="1172" height="64" rx="32" class="cohort-track" /><rect x="54" y="286" width="1172" height="64" rx="32" class="cohort-fill" /><text x="54" y="404" class="label" text-anchor="start">same rule</text><text x="340" y="404" class="label" text-anchor="start">same evidence window</text><text x="680" y="404" class="label" text-anchor="start">new fill/session view</text><line x1="170" y1="430" x2="1110" y2="430" class="gold-line" /><text x="54" y="544" class="equation" text-anchor="start">A screening pass opens another question.</text><text x="54" y="598" class="body" text-anchor="start">It does not become a live-trading promise.</text></g><g id="state-fill" class="state" aria-label="THE FILL CAN ARRIVE ONE BAR LATER"><text x="54" y="58" class="eyebrow" text-anchor="start">THE FILL CAN ARRIVE ONE BAR LATER</text><text x="54" y="150" class="hero-small" text-anchor="start">FILL = THE PRICE THE ORDER RECEIVES</text><text x="54" y="196" class="subhead" text-anchor="start">The stress moves the entry one bar later in the same direction.</text><text x="128" y="324" class="label" text-anchor="middle">SIGNAL</text><text x="638" y="324" class="label" text-anchor="middle">FILL</text><line x1="190" y1="308" x2="560" y2="308" class="gold-line" /><polygon points="560,308 526,286 526,330" class="gold-fill" /><line x1="710" y1="308" x2="1118" y2="308" class="failure-line" /><polygon points="1118,308 1084,286 1084,330" class="failure-fill" /><text x="375" y="376" class="body" text-anchor="middle">frozen signal price</text><text x="910" y="376" class="fail" text-anchor="middle">one bar later</text><line x1="190" y1="508" x2="1118" y2="508" class="track" /><text x="54" y="570" class="equation" text-anchor="start">Slippage is the price gap between the assumption and the fill.</text><text x="54" y="624" class="body" text-anchor="start">The proxy stresses the assumption; it does not impersonate a broker.</text></g><g id="state-latency" class="state" aria-label="TIME AND PRICE ARE DIFFERENT"><text x="54" y="58" class="eyebrow" text-anchor="start">TIME AND PRICE ARE DIFFERENT</text><text x="54" y="150" class="hero-small" text-anchor="start">LATENCY = TIME</text><text x="54" y="214" class="hero-small accent" text-anchor="start">SLIPPAGE = PRICE</text><line x1="120" y1="362" x2="1110" y2="362" class="gold-line" /><text x="120" y="420" class="label" text-anchor="start">signal</text><text x="850" y="420" class="label" text-anchor="start">response</text><circle cx="120" cy="362" r="12" class="gold-dot" /><circle cx="850" cy="362" r="12" class="gold-dot" /><text x="54" y="524" class="equation" text-anchor="start">A one-bar shift is a timing stress for the fill assumption.</text><text x="54" y="586" class="body" text-anchor="start">It is not a claim that every order waits one bar.</text></g><g id="state-split" class="state" aria-label="CUT THE SESSION AT THE MEDIAN HOUR"><text x="54" y="58" class="eyebrow" text-anchor="start">CUT THE SESSION AT THE MEDIAN HOUR</text><text x="54" y="150" class="hero-small" text-anchor="start">SPLIT SAMPLE</text><text x="54" y="196" class="subhead" text-anchor="start">Separate the same trade stream at the median entry hour.</text><rect x="90" y="310" width="1020" height="46" rx="23" class="cohort-track" /><rect x="90" y="310" width="506" height="46" rx="23" class="half-one" /><rect x="604" y="310" width="506" height="46" rx="23" class="half-two" /><line x1="604" y1="270" x2="604" y2="430" class="median-line" /><text x="350" y="440" class="label" text-anchor="middle">SESSION HALF 1</text><text x="860" y="440" class="label" text-anchor="middle">SESSION HALF 2</text><text x="604" y="252" class="eyebrow" text-anchor="middle">MEDIAN ENTRY HOUR</text><text x="54" y="548" class="equation" text-anchor="start">Each half gets its own profit-factor check.</text><text x="54" y="606" class="body" text-anchor="start">A blended average can hide a clock effect.</text></g><g id="state-regime" class="state" aria-label="A CLOCK SEGMENT CAN CARRY A RESULT"><text x="54" y="58" class="eyebrow" text-anchor="start">A CLOCK SEGMENT CAN CARRY A RESULT</text><text x="54" y="150" class="hero-small" text-anchor="start">REGIME = A DIFFERENT MARKET CONDITION</text><text x="54" y="196" class="subhead" text-anchor="start">Hours change the mix of prices, volatility, and participation.</text><path d="M90 430 C220 370 260 472 386 420 S560 348 684 408 S870 486 1000 386 S1090 370 1160 342" class="curve" /><line x1="90" y1="500" x2="1160" y2="500" class="track" /><text x="90" y="552" class="label" text-anchor="start">quiet</text><text x="564" y="552" class="label" text-anchor="middle">median hour</text><text x="1160" y="552" class="label" text-anchor="end">active</text><text x="54" y="624" class="body" text-anchor="start">The split can expose concentration; it cannot promise the next regime.</text></g><g id="state-strips" class="state" aria-label="THREE FAILURE SETS / ONE COHORT"><text x="54" y="58" class="eyebrow" text-anchor="start">THREE FAILURE SETS / ONE COHORT</text><text x="54" y="142" class="hero-small" text-anchor="start">THREE FAILURE SETS / ONE COHORT</text><text x="54" y="188" class="subhead" text-anchor="start">Each strip starts from the same 154 candidates.</text><text x="260" y="294" class="label" text-anchor="end">ONE-BAR FILL</text><line x1="300" y1="286" x2="1020" y2="286" class="track" /><line x1="300" y1="286" x2="491.68 ollars in that ledger.</text><text x="54" y="598" class="subhead" text-anchor="start">PF is one diagnostic; it does not summarize drawdown or cost.</text></g><g id="state-pass" class="state" aria-label="A PASS NEEDS THREE GREEN VALUES"><text x="54" y="58" class="eyebrow" text-anchor="start">A PASS NEEDS THREE GREEN VALUES</text><text x="54" y="136" class="hero-small" text-anchor="start">FORMULA-2309285457-3088</text><text x="54" y="184" class="subhead" text-anchor="start">All three views clear the same threshold.</text><rect x="54" y="254" width="1172" height="82" rx="18" class="pass-card" /><text x="92" y="306" class="pass" text-anchor="start">PASS</text><text x="260" y="306" class="label" text-anchor="start">three green values</text><text x="240" y="472" class="label" text-anchor="middle">FILL +1 BAR</text><text x="240" y="548" class="pass" text-anchor="middle">1.080180</text><text x="560" y="472" class="label" text-anchor="middle">SESSION HALF 1</text><text x="560" y="548" class="pass" text-anchor="middle">1.156412</text><text x="880" y="472" class="label" text-anchor="middle">SESSION HALF 2</text><text x="880" y="548" class="pass" text-anchor="middle">1.151833</text><text x="54" y="644" class="equation" text-anchor="start">1.080180   /   1.156412   /   1.151833</text></g><g id="state-survivors" class="state" aria-label="154 - 101 = 53"><text x="54" y="58" class="eyebrow" text-anchor="start">154 - 101 = 53</text><text x="54" y="150" class="hero-small" text-anchor="start">THE SURVIVOR EQUATION</text><text x="54" y="278" class="big-number" text-anchor="start">154</text><text x="280" y="278" class="operator" text-anchor="start">-</text><text x="390" y="278" class="big-number fail" text-anchor="start">101</text><text x="620" y="278" class="operator" text-anchor="start">=</text><text x="760" y="278" class="big-number pass" text-anchor="start">53</text><text x="54" y="360" class="label" text-anchor="start">entering</text><text x="390" y="360" class="label" text-anchor=
