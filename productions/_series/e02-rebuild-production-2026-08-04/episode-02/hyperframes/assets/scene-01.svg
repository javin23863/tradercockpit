<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img">
<rect width="1920" height="1080" fill="#080b12"/>
<style>
@font-face{font-family:'Bahnschrift';src:local('Bahnschrift');font-weight:100 900}
@font-face{font-family:'Consolas';src:local('Consolas');font-weight:100 900}
.kicker{font:700 24px 'Bahnschrift',sans-serif;letter-spacing:.14em;fill:#7ed7d2}
.title{font:800 66px 'Bahnschrift',sans-serif;fill:#f5f1e8}
.body{font:500 30px 'Bahnschrift',sans-serif;fill:#d8d8d1}
.small{font:600 22px 'Bahnschrift',sans-serif;fill:#a6adb8;letter-spacing:.04em}
.mono{font:700 34px 'Consolas',monospace;fill:#f5f1e8}
.mono-sm{font:700 25px 'Consolas',monospace;fill:#f5f1e8}
.accent{fill:#f0ba55}.cyan{fill:#7ed7d2}.muted{fill:#89929e}.ink{fill:#080b12}
.line{stroke:#33404e;stroke-width:3}.accent-line{stroke:#f0ba55;stroke-width:6}
.cyan-line{stroke:#7ed7d2;stroke-width:6}.seal{stroke:#d27ca7;stroke-width:7}
</style>
<text x="92" y="96" class="kicker" text-anchor="start">E02 / SCENE-01</text>
<text x="92" y="190" class="title" text-anchor="start">The stock branch stops before the chamber</text>
<line x1="92" y1="228" x2="1828" y2="228" class="line"/>
<text x="110" y="330" class="kicker" text-anchor="start">SPY / D1 / CONNORS RSI2</text>
<text x="150" y="486" class="mono" text-anchor="middle">5</text>
<text x="150" y="535" class="small" text-anchor="middle">enter</text>
<line x1="240" y1="470" x2="900" y2="470" class="accent-line"/>
<g fill="#f5f1e8"><circle cx="320" cy="440" r="18"/><circle cx="425" cy="440" r="18"/><circle cx="530" cy="440" r="18"/><circle cx="635" cy="440" r="18"/><circle cx="740" cy="440" r="18"/></g>
<rect x="930" y="300" width="46" height="440" rx="22" fill="#d27ca7"/>
<text x="1025" y="410" class="small" text-anchor="start">LATER-PRICE</text>
<text x="1025" y="455" class="mono-sm" text-anchor="start">CHAMBER</text>
<text x="1500" y="486" class="mono" text-anchor="middle">0</text>
<text x="1500" y="535" class="small" text-anchor="middle">advance</text>
<line x1="1100" y1="470" x2="1375" y2="470" class="line"/>
<text x="150" y="810" class="mono-sm" text-anchor="start">1996-07-12  →  2011-05-26</text>
<text x="150" y="875" class="body" text-anchor="start">holdout not reached</text>
<text x="1120" y="875" class="mono-sm" text-anchor="start">DOW / FUTURES  →  later block</text>
<text x="150" y="946" class="small" text-anchor="start">stock lane</text>
<text x="1510" y="946" class="small" text-anchor="middle">later prices remain sealed</text>
</svg>
