<line x1="190" y1="570" x2="1730" y2="570" class="line"/>
<g fill="#7ed7d2"><circle cx="250" cy="570" r="12"/><circle cx="375" cy="533" r="12"/><circle cx="500" cy="496" r="12"/><circle cx="625" cy="459" r="12"/><circle cx="750" cy="542" r="12"/><circle cx="875" cy="505" r="12"/><circle cx="1000" cy="468" r="12"/><circle cx="1125" cy="551" r="12"/><circle cx="1250" cy="514" r="12"/><circle cx="1375" cy="477" r="12"/><circle cx="1500" cy="560" r="12"/><circle cx="1625" cy="523" r="12"/></g>
<line x1="885" y1="415" x2="885" y2="700" class="accent-line"/>
<line x1="1220" y1="455" x2="1220" y2="700" class="seal"/>
