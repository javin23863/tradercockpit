<text x="1580" y="602" class="small" text-anchor="middle">actual  &gt;  threshold</text>
<text x="1765" y="602" class="accent" text-anchor="middle">FALSE</text>
<text x="150" y="760" class="kicker" text-anchor="start">TRADES / MONTH</text>
<text x="150" y="798" class="small" text-anchor="start">rate · trades / month</text>
<line x1="470" y1="750" x2="1640" y2="750" class="line"/>
<text x="560" y="772" class="mono-sm" text-anchor="start">0.392308</text>
