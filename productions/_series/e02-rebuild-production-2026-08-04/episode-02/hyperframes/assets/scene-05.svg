<text x="150" y="420" class="kicker" text-anchor="start">PF</text>
<text x="150" y="458" class="small" text-anchor="start">unitless ratio</text>
<line x1="470" y1="410" x2="1640" y2="410" class="line"/>
<text x="560" y="432" class="mono-sm" text-anchor="start">0.806004</text>
<text x="930" y="432" class="mono" text-anchor="middle">&gt;</text>
<text x="1310" y="432" class="mono-sm" text-anchor="start">1.3</text>
<text x="1580" y="432" class="small" text-anchor="middle">actual  &gt;  threshold</text>
<text x="1765" y="432" class="accent" text-anchor="middle">FALSE</text>
<text x="150" y="590" class="kicker" text-anchor="start">RET / DD</text>
<text x="150" y="628" class="small" text-anchor="start">unitless ratio</text>
<line x1="470" y1="580" x2="1640" y2="580" class="line"/>
<text x="560" y="602" class="mono-sm" text-anchor="start">-0.420205</text>
<text x="930" y="602" class="mono" text-anchor="middle">&gt;</text>
