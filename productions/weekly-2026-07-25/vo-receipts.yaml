      The Federal Reserve meets Tuesday and Wednesday, the twenty-eighth and twenty-ninth.
    claim: clm-fomc-2026-07-28
    attributed: true
  - quote: >-
      The global ten percent tariff under Section 122 was scheduled to expire Friday the twenty-fourth.
    claim: clm-section122-expiry-2026-07-24
    attributed: true
  - quote: >-
      An oil shock happened, and four instruments told me they expect it to fade.
    claim: clm-chart-brent-weekly-2026-07-24
  - quote: >-
      The number that decides it is 100.69 on a Brent close, with the Federal Reserve on Wednesday the twenty-ninth as the event most likely to move everything else underneath it.
