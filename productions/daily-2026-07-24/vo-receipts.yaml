"09":
  - quote: >-
      The Associated Press reported that the S and P five hundred lost zero point six percent
      for the week. The Dow lost zero point four percent. The Nasdaq composite lost two point
      one percent.
    claim: ap-weekly-index-moves
    attributed: true
  - quote: >-
      Friday added to a week in which the Nasdaq underperformed. Micron finished in the weak
      part of the tape, while Apple broke away from it.
    claim: weekly-selectivity
  - quote: >-
      The S and P's Friday bar also warns against reading a green close as a clean reset. The
      index reached seven thousand four hundred sixty point nine eight and finished at seven
      thousand four hundred eleven point nine eight.
    claim: tv-spx-dji-bars

"10":
  - quote: >-
      For the broad index, that means the S and P remains between seven thousand three hundred
      ninety-six point five three and seven thousand four hundred sixty point nine eight. For
      Micron, it means price remains between nine hundred four dollars and nine hundred
      sixty-seven dollars and fourteen cents.
    claim: tv-decision-levels
  - quote: >-
      If the S and P closes above seven thousand four hundred sixty point nine eight and Micron
      closes above nine hundred sixty-seven dollars and fourteen cents, then the relief has
      broader price support.
    claim: tv-decision-levels
  - quote: >-
      If the S and P closes below seven thousand three hundred ninety-six point five three and
      Micron closes below nine hundred four dollars, then Friday's mixed tape has expanded
      into broader weakness.
    claim: tv-decision-levels
  - quote: >-
      A close above three hundred thirty-four dollars and thirty-seven cents extends its
      relative strength. A close below three hundred twenty-one dollars and sixty-two cents
      removes it.
    claim: tv-decision-levels

"11":
