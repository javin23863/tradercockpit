"02":
  - quote: >-
      The Associated Press reported that Brent fell almost four percent to settle at
      ninety-six dollars and seventy-eight cents. One day earlier, the benchmark had reached
      one hundred two dollars.
    claim: ap-final-market-recap
    attributed: true
  - quote: >-
      The same final recap put the S and P five hundred at seven thousand four hundred eleven
      point nine eight, up three point six eight points. The Dow finished at fifty-one
      thousand nine hundred forty-seven point two five, up two hundred thirty-five point six
      zero. The Nasdaq composite ended at twenty-four thousand nine hundred seventy-five point
      eight two, down one hundred sixty-one point eight seven.
    claim: ap-final-market-recap
    attributed: true
  - quote: "The Associated Press also reported lower Treasury yields."
    claim: ap-yields-lower
    attributed: true

"03":
  - quote: >-
      Start with the S and P five hundred. Friday opened at seven thousand four hundred six
      point three zero, reached seven thousand four hundred sixty point nine eight, fell to
      seven thousand three hundred ninety-six point five three, and closed at seven thousand
      four hundred eleven point nine eight. That close was only fifteen point four five points
      above the low inside a sixty-four point four five point range. The index finished
      positive, but it retained little of the move to the session high. The Dow had a stronger
      close. It finished at fifty-one thousand nine hundred forty-seven point two five, up zero
      point four six percent, after reaching fifty-two thousand one hundred eighteen point one
      nine.
    claim: tv-spx-dji-bars

"04":
  - quote: >-
      The stock came into Friday from three hundred twenty-one dollars and sixty-six cents. It
      opened at three hundred twenty-one dollars and seventy-nine cents, reached three hundred
      thirty-four dollars and thirty-seven cents, and closed at three hundred thirty-three
      dollars and two cents. That was an eleven dollar and thirty-six cent gain, or three point
      five three percent. The close sat only one dollar and thirty-five cents below the session
      high.
    claim: tv-aapl-bar
  - quote: >-
      For Monday, Apple has three hundred thirty-four dollars and thirty-seven cents above and
      three hundred twenty-one dollars and sixty-two cents below.
    claim: tv-aapl-bar

"05":
  - quote: >-
      The prior close was nine hundred ninety dollars and twenty-one cents. Friday opened at
      nine hundred fifty-nine dollars and three cents, traded as high as nine hundred
      sixty-seven dollars and fourteen cents, fell to nine hundred four dollars, and closed at
      nine hundred twenty dollars and ninety-five cents. The loss was sixty-nine dollars and
      twenty-six cents, or six point nine nine percent. Micron closed sixteen dollars and
      ninety-five cents above its low inside a sixty-three dollar and fourteen cent session
      range.
    claim: tv-mu-bar
  - quote: >-
      The Associated Press identified Micron as a major reason the Nasdaq lagged during the
      day.
    claim: ap-micron-lag
    attributed: true
  - quote: >-
      Nine hundred sixty-seven dollars and fourteen cents is the repair level. A later close
      above it would recover Friday's entire range. Nine hundred four dollars is the downside
      level.
    claim: tv-mu-bar

"06":
  - quote: >-
      Friday made that distinction visible. Apple gained three point five three percent and
      finished near its high. Micron lost six point nine nine percent and finished near the
      lower part of its range. The S and P gained zero point zero five percent.
    claim: tv-composite-returns

"07":
  - quote: >-
      The Associated Press reported continued concern about whether spending on AI technology
      would produce profits large enough to justify elevated valuations. A Reuters session
      report described a market becoming more selective around AI spending and cash burn.
    claim: ai-spending-selectivity
  - quote: >-
      Friday's bars fit that selective shape. Apple gained three point five three percent.
      Micron lost six point nine nine percent. The S and P finished up zero point zero five
      percent.
    claim: tv-composite-returns

"08":
  - quote: >-
      Dow holders finished with a positive session. S and P holders were almost unchanged.
      Apple holders benefited from a strong gain that finished near the session high.
    claim: tv-spx-dji-bars
  - quote: >-
      Dow holders finished with a positive session. S and P holders were almost unchanged.
