name: website-integrity

on:
  push:
    paths:
      - "docs/**"
      - ".github/scripts/**"
      - ".github/reference-site/**"
      - ".github/site-build/**"
      - ".github/workflows/website-integrity.yml"
      - "DESIGN.md"
  pull_request:
    paths:
      - "docs/**"
      - ".github/scripts/**"
      - ".github/reference-site/**"
      - ".github/site-build/**"
      - ".github/workflows/website-integrity.yml"
      - "DESIGN.md"

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Rebuild production WebGL bundle
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix .github/site-build --ignore-scripts --no-audit --no-fund
          npm run build --prefix .github/site-build
          git diff --exit-code -- docs/assets/generated/site-webgl-v1.js docs/assets/generated/research-vtk-v1.js docs/assets/generated/research-vtk-v1.LICENSE.txt docs/assets/generated/research-vtk-v1.PROVENANCE.json
      - name: Validate site architecture and registries
        run: python .github/scripts/check_website.py
      - name: Validate public-site hardening contracts
        run: python .github/scripts/check_site_hardening.py
      - name: Validate public product claims and disclosure boundaries
        run: python .github/scripts/check_public_claims.py
      - name: Validate public UX contracts
        run: python .github/scripts/check_public_ux.py
      - name: Validate analytics and custom-domain root routes
        run: |
          node .github/scripts/test_analytics.mjs
          node .github/scripts/test_custom_domain.mjs
          node .github/scripts/test_early_access.mjs
          python .github/scripts/generate_product_pages.py --check
          python .github/scripts/check_plan_catalog.py
          python .github/scripts/test_plan_catalog.py
      - name: Run the browser tests on the served site
        shell: bash
        run: |
          set -euo pipefail
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          npm install --prefix "$RUNNER_TEMP/pp" --no-save --no-audit --no-fund --ignore-scripts puppeteer-core@25.16.0
          export TC_PUPPETEER_MODULE="$RUNNER_TEMP/pp/node_modules/puppeteer-core/lib/puppeteer/puppeteer-core.js"
          export TC_CHROME="$(command -v google-chrome)"
          node .github/scripts/test_reference_bridge.mjs
          node .github/scripts/test_reference_journeys.mjs
      - name: Validate all public JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find docs -type f \( -name '*.js' -o -name '*.mjs' \) -print0)
