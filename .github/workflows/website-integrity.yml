name: website-integrity

on:
  push:
    paths:
      - "docs/**"
      - ".github/scripts/check_website.py"
      - ".github/workflows/website-integrity.yml"
  pull_request:
    paths:
      - "docs/**"
      - ".github/scripts/check_website.py"
      - ".github/workflows/website-integrity.yml"

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate site architecture and help registry
        run: python .github/scripts/check_website.py
      - name: Validate Research Lab JavaScript syntax
        run: node --check docs/assets/research-lab.js
